name: Build figures

# Reproduces the 19 publication-quality PDF figures and uploads them
# (plus the CSV tables) as a downloadable artifact. Useful for reviewers
# who want to verify the paper's results without setting up Python locally.

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of seeds (3 = smoke, 30 = paper-grade)"
        required: false
        default: "3"
  push:
    branches: [main]
    paths:
      - "lcavo_sim.py"
      - ".github/workflows/figures.yml"

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python --version
          pip install -r requirements.txt

      - name: Generate figures and tables
        run: |
          python lcavo_sim.py \
            --seeds "${{ github.event.inputs.seeds || '3' }}" \
            --output-dir results

      - name: List generated artefacts
        run: |
          echo "--- figures ---"
          ls -lh results/figures || true
          echo "--- tables ---"
          ls -lh results/tables || true

      - name: Upload figures artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: |
            results/figures/*.pdf
            results/tables/*.csv
          retention-days: 30
